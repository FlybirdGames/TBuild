name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Release
            triplet: x64-windows
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            triplet: x64-linux
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            triplet: x64-linux
            cc: clang
            cxx: clang++

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.triplet }}-

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -BuildType $env:BUILD_TYPE -VcpkgRoot "${{ github.workspace }}\vcpkg" -VcpkgTriplet $env:VCPKG_TARGET_TRIPLET

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          TKB_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: bash scripts/build.sh
