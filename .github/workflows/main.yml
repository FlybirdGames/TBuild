name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            build_type: Release
            triplet: x64-windows
            slug: windows-msvc
          - os: ubuntu-latest
            compiler: gcc
            build_type: Release
            triplet: x64-linux
            cc: gcc
            cxx: g++
            slug: linux-gcc
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            triplet: x64-linux
            cc: clang
            cxx: clang++
            slug: linux-clang
          - os: macos-latest
            compiler: clang
            build_type: Release
            triplet: x64-osx
            cc: clang
            cxx: clang++
            slug: macos-clang

    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      BUILD_DIR: ${{ github.workspace }}/out/build/${{ matrix.slug }}-${{ matrix.build_type }}
      INSTALL_DIR: ${{ github.workspace }}/out/install/${{ matrix.slug }}-${{ matrix.build_type }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.triplet }}-

      - name: Build on Windows
        id: build_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -BuildDir $env:BUILD_DIR -BuildType $env:BUILD_TYPE -VcpkgRoot "${{ github.workspace }}\vcpkg" -VcpkgTriplet $env:VCPKG_TARGET_TRIPLET

      - name: Build on Unix
        id: build_unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          TKB_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: bash scripts/build.sh

      - name: Install package
        id: install_package
        if: >-
          ${{
            (runner.os == 'Windows' && steps.build_windows.outcome == 'success') ||
            (runner.os != 'Windows' && steps.build_unix.outcome == 'success')
          }}
        shell: bash
        run: cmake --install "$BUILD_DIR" --config "$BUILD_TYPE" --prefix "$INSTALL_DIR"

      - name: Upload package
        id: upload_package
        if: steps.install_package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tpkg-${{ matrix.slug }}-${{ matrix.build_type }}
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error

      - name: Write job status
        if: always()
        shell: bash
        run: |
          mkdir -p ci-status
          if [[ "${{ steps.upload_package.outcome }}" == "success" ]]; then
            echo "${{ matrix.slug }}" > "ci-status/success.txt"
          else
            echo "${{ matrix.slug }}" > "ci-status/failure.txt"
          fi

      - name: Upload job status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-status-${{ matrix.slug }}
          path: ci-status
          if-no-files-found: error

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download job status
        uses: actions/download-artifact@v4
        with:
          pattern: ci-status-*
          path: ci-status
          merge-multiple: false

      - name: Require at least one successful package
        shell: bash
        run: |
          success_count="$(find ci-status -name success.txt -print | wc -l | tr -d ' ')"
          echo "successful package jobs: ${success_count}"
          find ci-status -type f -print -exec cat {} \;
          if [[ "${success_count}" == "0" ]]; then
            echo "No package job produced an installable artifact."
            exit 1
          fi
